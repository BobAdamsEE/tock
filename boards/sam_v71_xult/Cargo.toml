[package]
name = "sam_v71_xult"
version.workspace = true
authors.workspace = true
build = "../build.rs"
edition.workspace = true

[dependencies]
components = { path = "../components" }
cortexm = { path = "../../arch/cortex-m" }
cortexm7 = { path = "../../arch/cortex-m7" }
kernel = { path = "../../kernel" }
samv71q21b = { path = "../../chips/samv71q21b" }
capsules-core = { path = "../../capsules/core" }
capsules-extra = { path = "../../capsules/extra" }
capsules-system = { path = "../../capsules/system" }
ecdsa-sw = { path = "../../capsules/ecdsa_sw" }
tock-tbf = { path = "../../libraries/tock-tbf" }
segger = { path = "../../chips/segger" }

[features]
# Console at 921600 baud instead of 115200 (see CONSOLE_BAUD in main.rs).
fast_console = []
# Let applications write to the SD card and issue raw SD commands (the
# sd_shell app). Off by default: the default kernel cannot alter a card, which
# is what sd_inspect and sd_dump rely on when examining deleted data.
sd_write = []

[build-dependencies]
tock_build_scripts = { path = "../build_scripts" }

[lints]
workspace = true
