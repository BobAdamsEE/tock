[package]
name = "sam_v71_xult"
version = "0.1.0"
authors = ["Bob Adams <bob@bobadams5.com>"]
build = "../build.rs"
edition = "2021"

[dependencies]
components = { path = "../components" }
cortexm7 = { path = "../../arch/cortex-m7" }
kernel = { path = "../../kernel" }
samv71q21b = { path = "../../chips/samv71q21b" }
capsules-core = { path = "../../capsules/core" }
capsules-extra = { path = "../../capsules/extra" }
capsules-system = { path = "../../capsules/system" }
ecdsa-sw = { path = "../../capsules/ecdsa_sw" }
tock-tbf = { path = "../../libraries/tock-tbf" }

[build-dependencies]
tock_build_scripts = { path = "../build_scripts" }

[profile.dev]
panic = "abort"
lto = false
opt-level = "z"
debug = true

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
debug = true
